<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warren Spencer</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" href="images/favicon.ico">

    <!-- Applies the saved theme before anything paints, so there's no flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <header class="header" id="top">
        <div class="row">
            <nav class="nav" aria-label="Main">
                <a href="index.html" class="name">
                    <img src="images/Warren Spencer Rocket Logo.png" alt="W Logo" class="logo">
                    <span>Warren</span>
                </a>
                <ul class="nav_links">
                    <li class="nav_link"><a href="index.html">Home</a></li>
                    <li class="nav_link"><a href="about.html">About</a></li>
                    <li class="nav_link"><a href="experience.html">Experience</a></li>
                    <li class="nav_link"><a href="projects.html">Projects</a></li>
                </ul>

                <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" aria-pressed="false">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="talk-btn" id="talkBtn" type="button">Let's Talk</button>
            </nav>
        </div>
    </header>

    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
        <a href="#" class="talk-link-mobile">Let's Talk</a>
    </div>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Warren Spencer</h1>
                    <p>Software Engineer</p>
                    <p class="new">Software development and AI are my passion!</p>
                    <div class="contact-social">
                        <a href="contact.html" class="btn"><i class="fas fa-file-alt"></i>View CV</a>
                        <div class="social-links">
                            <a href="mailto:warrenspencer41@gmail.com" aria-label="Email">
                                <i class="fas fa-envelope"></i>
                            </a>
                            <a href="https://www.linkedin.com/in/warrendavidspencer/" target="_blank" rel="noopener" aria-label="LinkedIn">
                                <i class="fab fa-linkedin"></i>
                            </a>
                            <a href="https://github.com/WarrenDev4" target="_blank" rel="noopener" aria-label="GitHub">
                                <i class="fab fa-github"></i>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="images/Professional Photo (2).jpg" alt="Warren Spencer">
                </div>
            </div>
        </section>
    </main>

    <!-- ===== Let's Talk modal ===== -->
    <div class="modal-overlay" id="talkModal" role="dialog" aria-modal="true" aria-labelledby="talkTitle" aria-hidden="true">
        <div class="modal">
            <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
            <h2 id="talkTitle">Let's Talk</h2>
            <p class="modal-sub">Send me a message and I'll get back to you soon.</p>

            <form class="modal-form" id="talkForm">
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                <input type="hidden" name="subject" value="New message from your portfolio">
                <input type="checkbox" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off">

                <label for="talkName">Name</label>
                <input type="text" id="talkName" name="name" required autocomplete="name">

                <label for="talkEmail">Email</label>
                <input type="email" id="talkEmail" name="email" required autocomplete="email">

                <label for="talkMessage">Message</label>
                <textarea id="talkMessage" name="message" rows="5" required></textarea>

                <button type="submit" class="modal-submit" id="modalSubmit">Send message</button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>

<script>
/* ===== Mobile menu ===== */
(function () {
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('menuOverlay');

  function setMenu(open) {
    hamburger.classList.toggle('open', open);
    mobileMenu.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', String(open));
    hamburger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.classList.toggle('menu-open', open);
  }

  hamburger.addEventListener('click', () => setMenu(!mobileMenu.classList.contains('open')));
  overlay.addEventListener('click', () => setMenu(false));

  // Expose so the modal can close the menu when it opens
  window.__closeMobileMenu = () => setMenu(false);
})();

/* ===== Theme toggle ===== */
(function () {
  const btn = document.getElementById('themeBtn');
  const icon = document.getElementById('themeIcon');
  const root = document.documentElement;

  function paint(theme) {
    const dark = theme === 'dark';
    icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    btn.setAttribute('aria-pressed', String(dark));
  }

  paint(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    if (next === 'dark') {
      root.setAttribute('data-theme', 'dark');
    } else {
      root.removeAttribute('data-theme');
    }
    try { localStorage.setItem('theme', next); } catch (e) {}
    paint(next);
  });
})();

/* ===== Let's Talk modal ===== */
(function () {
  const modal = document.getElementById('talkModal');
  const openBtn = document.getElementById('talkBtn');
  const mobileLink = document.querySelector('.talk-link-mobile');
  const closeBtn = document.getElementById('modalClose');
  const form = document.getElementById('talkForm');
  const submitBtn = document.getElementById('modalSubmit');
  const status = document.getElementById('formStatus');
  let lastFocused = null;

  function openModal(e) {
    if (e) e.preventDefault();
    if (window.__closeMobileMenu) window.__closeMobileMenu();

    lastFocused = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('talkName').focus(), 350);
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    status.textContent = '';
    status.className = 'form-status';
    if (lastFocused) lastFocused.focus();
  }

  openBtn.addEventListener('click', openModal);
  if (mobileLink) mobileLink.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // Keep keyboard focus inside the dialog while it's open
  modal.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const focusable = modal.querySelectorAll('button, input:not([type="hidden"]):not(.hp-field), textarea');
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    status.textContent = '';
    status.className = 'form-status';

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });
      const data = await res.json();

      if (!data.success) throw new Error(data.message || 'Send failed');

      status.textContent = 'Message sent. Thanks for reaching out!';
      status.classList.add('success');
      form.reset();
      setTimeout(closeModal, 2200);
    } catch (err) {
      status.innerHTML = 'The message didn\'t send. Try again, or email me at ' +
        '<a href="mailto:warrenspencer41@gmail.com">warrenspencer41@gmail.com</a>.';
      status.classList.add('error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send message';
    }
  });
})();
</script>
</body>
</html>
